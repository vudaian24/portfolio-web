name: Setup Node.js and dependencies
description: Setup Node 24 with Yarn cache, restore Next.js cache, and install dependencies

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        cache: yarn

    # .next/cache holds the webpack and fetch caches used by `next build`.
    # Key on the lockfile and the app sources so a stale build cache is not reused.
    - name: Cache Next.js build
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .next/cache
        key: ${{ runner.os }}-nextjs-${{ hashFiles('yarn.lock') }}-${{ hashFiles('src/**', 'public/**', 'next.config.ts', 'package.json') }}
        restore-keys: |
          ${{ runner.os }}-nextjs-${{ hashFiles('yarn.lock') }}-

    - name: Install dependencies
      shell: bash
      run: yarn install --frozen-lockfile
