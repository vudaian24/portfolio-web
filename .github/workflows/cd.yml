name: CD

on:
  workflow_call:
    inputs:
      image_tag:
        required: true
        type: string
    # Không cần khai báo secret nào ở đây cho build-and-push nữa:
    # GITHUB_TOKEN tự có sẵn trong mọi job (không phải secret repo thường,
    # không cần secrets: inherit) — đủ quyền push lên ghcr.io nhờ khối
    # `permissions` khai báo ngay dưới job.
    #
    # VPS_HOST, VPS_SSH_KEY, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID không
    # khai báo ở đây — job `deploy` dùng `secrets: inherit` để chuyển
    # tiếp nguyên trạng ngữ cảnh secret từ caller (main.yml) xuống
    # deploy.yml, không cần cd.yml tự khai báo lại.

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    # packages: write — quyền GITHUB_TOKEN cần để push lên ghcr.io.
    # contents: read — mặc định của checkout, khai báo rõ vì đã ghi đè
    # permissions (khai báo permissions ở bất kỳ cấp nào sẽ TẮT hết các
    # quyền không nêu tên, không cộng dồn thêm vào mặc định).
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # ghcr.io (không phải Docker Hub) — image PRIVATE theo mặc định của
      # GHCR khi repo private, và ta ép private rõ ràng ngay sau lần push
      # đầu tiên. Dùng GITHUB_TOKEN, không cần tạo
      # hay xoay vòng secret riêng cho việc build/push.
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/portfolio-web:latest
            ghcr.io/${{ github.repository_owner }}/portfolio-web:${{ inputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=min

  # Tách deploy thành workflow riêng (deploy.yml) để dùng lại được cho cả
  # rollback thủ công (main.yml, workflow_dispatch) mà không phải build lại.
  deploy:
    name: Deploy
    needs: build-and-push
    uses: ./.github/workflows/deploy.yml
    with:
      image_tag: ${{ inputs.image_tag }}
    secrets: inherit
